name: Check
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  records-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [America/Los_Angeles, Asia/Shanghai]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
